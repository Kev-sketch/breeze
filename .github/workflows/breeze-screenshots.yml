name: Breeze Screenshots

# Captures real README screenshots of the built app on the macOS 26 runner. The
# app cannot run on the local dev machine (it needs macOS 14), so this is where
# captures happen. Results are uploaded as artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Build and capture screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Install cliclick
        run: brew install cliclick || true

      - name: Launch and capture
        run: |
          set -x
          mkdir -p shots
          APP="build/stage/Breeze.app"
          [ -d "$APP" ] || APP="build/Breeze.app"
          open "$APP"
          sleep 14
          screencapture -x shots/01-onboarding.png || true

          # Open the menu-bar panel via the status item.
          osascript -e 'tell application "System Events" to tell process "Breeze" to click menu bar item 1 of menu bar 2' || true
          sleep 3
          screencapture -x shots/02-panel-keepawake.png || true

          # Click through the panel tabs (icon row), capturing each section.
          CLICK=""
          command -v cliclick >/dev/null && CLICK="cliclick"
          [ -z "$CLICK" ] && [ -x /opt/homebrew/bin/cliclick ] && CLICK=/opt/homebrew/bin/cliclick
          click_at() {
            if [ -n "$CLICK" ]; then "$CLICK" c:$1,$2
            else osascript -e "tell application \"System Events\" to click at {$1, $2}"; fi
          }
          i=2
          for x in 690 742 790 840 890; do
            i=$((i+1))
            click_at "$x" 120 || true
            sleep 2
            screencapture -x "shots/0${i}-panel-x${x}.png" || true
          done
          pgrep -fl Breeze || true
          ls -la shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breeze-screenshots
          path: shots
          if-no-files-found: warn
